[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "toroidal-fractal-intelligence"
version = "0.1.0"
description = "Toroidal Fractal Intelligence — continuous structured learning architecture"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1.0",
    "numpy>=1.24.0",
    "datasets>=2.14.0",
    "transformers>=4.36.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "black", "ruff"]

[tool.setuptools.packages.find]
include = ["toroidal_fractal_intelligence*"]
